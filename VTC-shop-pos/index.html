<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hobby Store Custom POS Terminal</title>
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 font-sans min-h-screen flex flex-col">

    <!-- Header Section -->
    <header class="bg-gray-800 p-4 border-b border-gray-700 flex justify-between items-center shadow-md">
        <h1 class="text-xl font-bold tracking-wide text-orange-500">VTC Games & More POS</h1>
        <div id="connection-badge" class="bg-green-600 text-xs px-3 py-1 rounded-full font-semibold">LOCAL ENGINE LINKED</div>
    </header>

    <!-- Main Workspace Grid Layout -->
    <main class="flex-1 grid grid-cols-12 gap-4 p-4 overflow-hidden">
        
        <!-- Left Side Panel: Scans & Action Fields -->
        <section class="col-span-8 bg-gray-800 rounded-lg border border-gray-700 p-4 flex flex-col">
            <div class="mb-4">
                <label class="block text-sm font-semibold mb-2 text-gray-400">Scan Item Barcode or Enter SKU Number</label>
                <input type="text" id="barcode-input" placeholder="Click here and scan item..." autofocus 
                       class="w-full bg-gray-900 text-white border-2 border-gray-600 rounded-lg p-3 text-lg focus:outline-none focus:border-orange-500 tracking-wider">
            </div>

            <!-- Interactive Checkout Ticket Cart View -->
            <div class="flex-1 border border-gray-700 bg-gray-950 rounded-lg p-2 overflow-y-auto">
                <table class="w-full text-left">
                    <thead>
                        <tr class="border-b border-gray-700 text-gray-400 text-sm">
                            <th class="p-2">Item Name</th>
                            <th class="p-2 text-center w-24">Qty</th>
                            <th class="p-2 text-right w-32">Price</th>
                            <th class="p-2 text-center w-16">Action</th>
                        </tr>
                    </thead>
                    <tbody id="cart-table-body">
                        <!-- Dynamic items spawn elements inject inside rows via JavaScript -->
                    </tbody>
                </table>
            </div>
        </section>

        <!-- Right Side Panel: Checkout Balance Details -->
        <section class="col-span-4 bg-gray-800 rounded-lg border border-gray-700 p-4 flex flex-col justify-between shadow-xl">
            <div>
                <h2 class="text-lg font-bold border-b border-gray-700 pb-2 mb-4 text-gray-300">Transaction Summary</h2>
                <div class="space-y-3">
                    <div class="flex justify-between text-gray-400"><span>Subtotal:</span><span id="subtotal-val">$0.00</span></div>
                    <div class="flex justify-between text-gray-400"><span>Local Sales Tax (6.25%):</span><span id="tax-val">$0.00</span></div>
                    <div class="flex justify-between text-2xl font-bold border-t border-gray-700 pt-3 text-orange-400">
                        <span>TOTAL DUE:</span><span id="total-val">$0.00</span>
                    </div>
                </div>
            </div>

            <!-- Transaction Actions and Options -->
            <div class="mt-6 space-y-3">
                <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400">Select Cashier Payment Entry</label>
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="setPayment('Cash')" id="pay-cash-btn" class="bg-gray-700 hover:bg-gray-600 border border-gray-600 text-white font-bold p-3 rounded-lg transition-colors">💵 CASH</button>
                    <button onclick="setPayment('External Card')" id="pay-card-btn" class="bg-gray-700 hover:bg-gray-600 border border-gray-600 text-white font-bold p-3 rounded-lg transition-colors">💳 BOA READER</button>
                </div>
                <button onclick="submitCheckoutTransaction()" class="w-full bg-orange-600 hover:bg-orange-500 font-extrabold text-lg py-4 px-6 rounded-lg shadow-lg tracking-wide uppercase mt-4 transition-transform active:scale-95">
                    Finalize & Commit Order
                </button>
            </div>
        </section>
    </main>

    <!-- Client-Side Terminal Application Controller Core Scripts -->
    <script>
        let cart = [];
        let paymentMethod = 'Cash';

        // Event listener designed for high-velocity hardware barcode input capture loops
        document.getElementById('barcode-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                const barcode = e.target.value.trim();
                if (barcode) {
                    fetchProductFromLocalEngine(barcode);
                }
                e.target.value = ''; // Clean input instantly for subsequent scans
            }
        });

        async function fetchProductFromLocalEngine(barcode) {
            try {
                const response = await fetch(`/api/products/scan/${barcode}`);
                if (!response.ok) throw new Error('Product not present in database registry');
                const product = await response.json();
                
                const existingIndex = cart.findIndex(item => item.id === product.id);
                if (existingIndex > -1) {
                    cart[existingIndex].quantity += 1;
                } else {
                    cart.push({ ...product, quantity: 1 });
                }
                renderCartUI();
            } catch (err) {
                alert("Scan Error: Barcode or custom SKU identifier unknown.");
            }
        }

        function renderCartUI() {
            const tbody = document.getElementById('cart-table-body');
            tbody.innerHTML = '';
            let subtotal = 0;

            cart.forEach((item, index) => {
                subtotal += item.price * item.quantity;
                tbody.innerHTML += `
                    <tr class="border-b border-gray-800 hover:bg-gray-900 transition-colors">
                        <td class="p-2 py-3 font-medium text-gray-200">${item.name} <span class="text-xs text-gray-500 block">${item.sku}</span></td>
                        <td class="p-2 text-center font-bold text-orange-400">${item.quantity}</td>
                        <td class="p-2 text-right font-mono font-semibold text-gray-300">$${(item.price * item.quantity).toFixed(2)}</td>
                        <td class="p-2 text-center"><button onclick="removeItem(${index})" class="text-red-500 hover:text-red-400 font-bold px-2">✕</button></td>
                    </tr>
                `;
            });

            // Standard calculations breakdown models logic loop processing
            const taxRate = 0.0625; // Adapt configuration variables to match local values
            const tax = subtotal * taxRate;
            const total = subtotal + tax;

            document.getElementById('subtotal-val').innerText = `$${subtotal.toFixed(2)}`;
            document.getElementById('tax-val').innerText = `$${tax.toFixed(2)}`;
            document.getElementById('total-val').innerText = `$${total.toFixed(2)}`;
        }

        function removeItem(index) {
            cart.splice(index, 1);
            renderCartUI();
        }

        function setPayment(method) {
            paymentMethod = method;
            document.getElementById('pay-cash-btn').className = method === 'Cash' ? 'bg-orange-600 border border-orange-500 text-white font-bold p-3 rounded-lg' : 'bg-gray-700 text-white p-3 rounded-lg';
            document.getElementById('pay-card-btn').className = method === 'External Card' ? 'bg-orange-600 border border-orange-500 text-white font-bold p-3 rounded-lg' : 'bg-gray-700 text-white p-3 rounded-lg';
        }

        async function submitCheckoutTransaction() {
            if (cart.length === 0) return alert("The cart payload is empty.");
            
            const payload = {
                items: cart.map(i => ({ product_id: i.id, quantity: i.quantity })),
                payment_method: paymentMethod
            };

            try {
                const response = await fetch('/api/checkout', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    alert(`Transaction successful. Processed via: ${paymentMethod}`);
                    cart = [];
                    renderCartUI();
                    document.getElementById('barcode-input').focus();
                } else {
                    const err = await response.json();
                    alert(`Checkout Rejected: ${err.detail}`);
                }
            } catch (error) {
                alert("Network timeout or local engine crash detected.");
            }
        }
        
        setPayment('Cash'); // Set initial baseline defaults on initial load layout parameters
    </script>
</body>
</html>
